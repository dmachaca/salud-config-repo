server.port=8080

# ===============================
# EUREKA
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===============================
# GATEWAY ROUTES (VERSIÓN MODERNA)
# ===============================

# AUTH SERVICE
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/v1/api/auth/**

# PACIENTE SERVICE
spring.cloud.gateway.server.webflux.routes[1].id=paciente-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PACIENTE-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/v1/api/pacientes/**

# PERSONAL SERVICE
spring.cloud.gateway.server.webflux.routes[2].id=personal-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://PERSONAL-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/v1/api/personal/**

# CITA SERVICE
spring.cloud.gateway.server.webflux.routes[3].id=cita-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://CITA-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/v1/api/cita/**

# ATENCION SERVICE
spring.cloud.gateway.server.webflux.routes[4].id=atencion-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://ATENCION-SERVICE
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/v1/api/atenciones/**

# ===============================
# ACTUATOR
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# ===============================
# JWT
# ===============================
application.security.jwt.secret=bXlfc3VwZXJfc2VjcmV0X2tleV8yMDI2X2F1dGhfc2VydmljZQ==

# =========================================================
# CONFIGURACIÓN CENTRALIZADA PARA CITA-SERVICE  - INTER-SERVICE (FEIGN)
# =========================================================

# Habilitar Circuit Breaker para que los Fallbacks funcionen
# Habilitar Circuit Breaker en Feign (Indispensable para que use tus Fallbacks)
feign.circuitbreaker.enabled=true
# Usa esta ruta completa (es la estándar en Spring Boot 3+)
spring.cloud.openfeign.circuitbreaker.enabled=true

# OBLIGATORIO: Para que Feign use Circuit Breaker en errores de Load Balancer
spring.cloud.openfeign.circuitbreaker.group.enabled=true

# Recomendado: Para que el monitoreo en /actuator/health sea detallado
management.health.circuitbreakers.enabled=true

# Configuración de Resilience4j para el Circuit Breaker
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50

resilience4j.timelimiter.configs.default.timeout-duration=5s

# Para que el contexto de la petición se herede en los hilos de Resilience4j
spring.security.strategy=MODE_INHERITABLETHREADLOCAL

# ESTO ES LO MÁS IMPORTANTE PARA TU ERROR 401:
# Para asegurar que Feign comparta el RequestContext (Security Context)
spring.main.allow-bean-definition-overriding=true

# Tiempos de espera para las llamadas entre microservicios
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# Si prefieres mantener las variables de URL por algún motivo:
app.services.personal.url=http://personal-service
app.services.paciente.url=http://paciente-service