server.port=8085

spring.application.name=atencion-service

# ===============================
# EUREKA
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===============================
# POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/atencion_db?currentSchema=atencion
spring.datasource.username=atencion_app
spring.datasource.password=AtencionApp#2026
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=atencion
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# ACTUATOR & HEALTH
# ===============================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.info.env.enabled=true

# ===============================
# RESILIENCE4J (CIRCUIT BREAKER)
# ===============================
# El nombre 'cita-service' debe coincidir con el @CircuitBreaker(name = "cita-service")
resilience4j.circuitbreaker.instances.cita-service.register-health-indicator=true
# Número de peticiones para evaluar el estado
resilience4j.circuitbreaker.instances.cita-service.sliding-window-size=10
# Porcentaje de error (50%) para abrir el circuito
resilience4j.circuitbreaker.instances.cita-service.failure-rate-threshold=50
# Tiempo que permanece abierto antes de intentar pasar a medio-abierto
resilience4j.circuitbreaker.instances.cita-service.wait-duration-in-open-state=15s
# Permitir llamadas en estado medio-abierto para probar si el servicio volvió
resilience4j.circuitbreaker.instances.cita-service.permitted-number-of-calls-in-half-open-state=3

# 4. VARIABLES DE URL PARA TUS CLIENTES FEIGN
# En ATENCIÓN, el destino es CITA
app.services.cita-url=http://cita-service

# ===============================
# FEIGN CLIENT CONFIG
# ===============================
# Para que Feign no espere eternamente si el otro servicio está lento
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000