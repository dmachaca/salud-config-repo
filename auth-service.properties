server.port=8081

# ===============================
# EUREKA
# ===============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# ===============================
# POSTGRESQL
# ===============================
# Añadimos ?currentSchema=auth para que conecte directo a tu esquema
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db?currentSchema=auth
spring.datasource.username=auth_app
spring.datasource.password=AuthApp#2026
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
# Como ya creaste las tablas con el script, usa 'validate' o 'none' para evitar conflictos
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Obligamos a Hibernate a usar el esquema auth por defecto en las consultas
spring.jpa.properties.hibernate.default_schema=auth
# Esto es vital para que reconozca que usas PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT
# ===============================
jwt.secret=mi_clave_super_secreta_muy_larga_para_cumplir_con_el_algoritmo_256
jwt.expiration=3600000