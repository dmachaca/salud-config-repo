# =========================================================
# CONFIGURACIÓN GENERAL
# =========================================================
server.port=8081
spring.application.name=auth-service

# =========================================================
# EUREKA (Descubrimiento de Servicios)
# =========================================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Tiempo para refrescar la lista de otros micros (útil en desarrollo)
eureka.client.registry-fetch-interval-seconds=5

# =========================================================
# POSTGRESQL (Base de Datos de Seguridad)
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db?currentSchema=auth
spring.datasource.username=auth_app
spring.datasource.password=AuthApp#2026
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================
# Usamos 'validate' porque ya tienes las tablas creadas por script
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=auth
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================================================
# JWT (Configuración de Seguridad)
# =========================================================
application.security.jwt.secret=bXlfc3VwZXJfc2VjcmV0X2tleV8yMDI2X2F1dGhfc2VydmljZQ==
application.security.jwt.expirationMs=3600000
application.security.jwt.refreshExpirationMs=86400000

# =========================================================
# RESILIENCIA (FEIGN & CIRCUIT BREAKER)
# =========================================================
# Habilitar el uso de Fallbacks en Feign
spring.cloud.openfeign.circuitbreaker.enabled=true

# Timeouts de conexión para evitar que el micro se cuelgue esperando al otro
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=5000

# 3. CONFIGURACIÓN DEL CIRCUIT BREAKER (RESILIENCE4J)
resilience4j.circuitbreaker.configs.default.registerHealthIndicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s

# Esto es lo que hace que Citas sea más paciente y no truene rápido
resilience4j.timelimiter.configs.default.timeout-duration=5s

# Copia exactamente esto que tienes en Citas hacia el Auth
spring.cloud.openfeign.circuitbreaker.group.enabled=true

# 4. VARIABLES DE URL PARA TUS CLIENTES FEIGN
# Se mantienen por si tu código Java las referencia con @Value
app.services.paciente.url=http://paciente-service


# =========================================================
# MONITOREO (ACTUATOR)
# =========================================================
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true


# =========================
# INFO
# =========================
info.app.name=auth-service
info.app.version=1.0.0
info.app.description=Authentication Microservice
info.app.author=D Machaca

# =========================
# RECAPCHA GOOGLE CONFIG
# =========================
recaptcha.siteKey=6LcV3tgsAAAAAMN20TXl9Jw1UttEtkru-p_Ppwzg
recaptcha.secretKey=6LcV3tgsAAAAAMJNVsu-FzJhobEcOQ1LVYcLdW9d
recaptcha.threshold=0.5
recaptcha.validar=false
seguridad.validar=true
recaptcha.url.template=https://www.google.com/recaptcha/api/siteverify?secret=%s&response=%s&remoteip=%s